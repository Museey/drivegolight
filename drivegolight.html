<style>
:root{
  --ink:#16202B;
  --ink-2:#43535F;
  --ink-3:#7C8B96;
  --line:#D5DDE2;
  --line-2:#E9EEF1;
  --surface:#EFF2F4;
  --panel:#FFFFFF;
  --steel:#17607A;
  --steel-dk:#0E4356;
  --steel-soft:#E3EFF3;

  --brand-green:#37B554;
  --brand-yellow:#FFEF5B;

  --flag-min-bg:#F6D264;      /* ถึงจุดสั่งซื้อ (Min) */
  --flag-min-ink:#5E4400;
  --flag-max-bg:#F6B7B2;      /* เกิน Max */
  --flag-max-ink:#7E251D;
  --flag-dead-bg:#D9BE9C;     /* ไม่เคลื่อนไหว > 6 เดือน */
  --flag-dead-ink:#5F4222;

  --ok:#1D7A5F;
  --warn:#B4720B;
  --danger:#B3382C;
  --r:6px;
  --shadow:0 1px 2px rgba(22,32,43,.08), 0 8px 24px -16px rgba(22,32,43,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Thai',system-ui,'Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
  background:var(--surface); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono,input.mono,td.num,th.num{font-family:'IBM Plex Mono','IBM Plex Sans Thai',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--steel)}

/* ---------- โครงหน้าจอ ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{
  background:var(--ink); color:#C9D6DE; padding:18px 14px; position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; gap:4px;
}
.rail .brand{display:flex;gap:10px;align-items:center;padding:2px 6px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.rail .brand b{color:#fff;font-size:15px;letter-spacing:.2px;display:block;line-height:1.25}
.rail .brand span{font-size:11px;color:#8FA3B0;letter-spacing:.14em;text-transform:uppercase}
.rail .brand img.logo{width:34px;height:34px;flex:none;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.rail .brand b{letter-spacing:-.1px}
.rail .brand b em{font-style:normal;color:var(--brand-green)}
.rail .brand .shop{display:block;font-size:11.5px;color:#8FA3B0;letter-spacing:0;text-transform:none;line-height:1.35;margin-top:2px}
.rail .foot a{color:#8FA3B0;text-decoration:none}
.rail .foot a:hover{color:#fff}
.memwarn{background:#B4720B;color:#fff;border-radius:5px;padding:7px 9px;font-size:11px;line-height:1.5;margin-bottom:10px}
.backupBanner{display:none;align-items:center;gap:14px;background:#FCF3E2;border-bottom:1px solid #EEDBB4;color:var(--warn);padding:9px 22px;font-size:12.5px}
.backupBanner.on{display:flex}
.backupBanner span{flex:1}
.backupBanner button{flex:none}
.licbadge{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:9px 10px;margin-bottom:10px;
  cursor:pointer;font-size:11.5px;line-height:1.5;background:rgba(255,255,255,.08);color:#C9D6DE}
.licbadge:hover{background:rgba(255,255,255,.14)}
.licbadge b{display:block;color:#fff;font-size:12.5px;margin-bottom:1px}
.licbadge.trial{background:#3C4A16;color:#E5EFC4}
.licbadge.trial b{color:var(--brand-yellow)}
.licbadge.warn{background:#6B4A08;color:#FBE7BE}
.licbadge.warn b{color:#FFD469}
.licbadge.expired{background:#7A2018;color:#FBD7D3}
.licbadge.expired b{color:#FFB4AB}
.licbadge.active{background:#14432A;color:#BFE3CE}
.licbadge.active b{color:#6FE39A}
.pricebox{border:1px solid var(--line);border-radius:8px;padding:18px 20px;background:#FAFCFD}
.pricebox .amt{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;line-height:1.1}
.pricebox .amt small{font-size:14px;color:var(--ink-3);font-weight:400;font-family:'IBM Plex Sans Thai',sans-serif}
.keyin{font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.12em;text-align:center;text-transform:uppercase}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#C9D6DE;
  padding:9px 10px;border-radius:var(--r);cursor:pointer;font-size:14px
}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.navbtn[aria-current="true"]{background:var(--steel);color:#fff;font-weight:600}
.navbtn .k{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#7E93A1;width:14px;flex:none}
.navbtn[aria-current="true"] .k{color:#BFE0EC}
.rail .foot{margin-top:auto;font-size:11px;color:#6F8492;line-height:1.6;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}

.main{min-width:0;padding:0 0 60px}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(239,242,244,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap
}
.topbar h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.1px}
.topbar .sub{font-size:12px;color:var(--ink-3)}
.spacer{margin-left:auto}
.wrap{padding:20px 22px}
.view{display:none}
.view.on{display:block}

/* ---------- ส่วนประกอบ ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card > header{
  padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap
}
.card > header h2{margin:0;font-size:14px;font-weight:600}
.card > header .hint{font-size:12px;color:var(--ink-3)}
.card .body{padding:16px}

.btn{
  border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:var(--r);cursor:pointer;
  font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap
}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.primary:hover{background:var(--steel-dk);border-color:var(--steel-dk)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--steel)}
.btn.ghost:hover{background:var(--steel-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger);border-color:#EFCFCB}
.btn.danger:hover{background:#FCF1F0}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.in{
  width:100%;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:#fff;
}
.in:focus{outline:2px solid var(--steel);outline-offset:-1px;border-color:var(--steel)}
.in[readonly]{background:#F6F8F9;color:var(--ink-2)}
textarea.in{resize:vertical;min-height:38px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.sec-title{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  display:flex;align-items:center;gap:10px;margin:22px 0 10px
}
.sec-title:first-child{margin-top:0}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line-2)}

/* ---------- ตาราง ---------- */
.tablewrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:#FAFBFC;position:sticky;top:0;z-index:1;white-space:nowrap
}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tbody tr:hover{background:#FAFCFD}
th.num,td.num{text-align:right}
.empty{padding:38px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- ป้ายรหัสสินค้า (signature element) ---------- */
.tag{
  display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 8px;border-radius:3px;
  border:1px solid var(--line);background:#F7F9FA;font-family:'IBM Plex Mono',monospace;
  font-size:13px;font-weight:600;letter-spacing:.02em;position:relative;min-width:104px
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.28);flex:none}
.tag.min{background:var(--flag-min-bg);border-color:#DCB53D;color:var(--flag-min-ink)}
.tag.max{background:var(--flag-max-bg);border-color:#E39B94;color:var(--flag-max-ink)}
.tag.dead{background:var(--flag-dead-bg);border-color:#BFA079;color:var(--flag-dead-ink)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dot{width:7px;height:7px;border-radius:50%;border:1px solid rgba(0,0,0,.22)}
.dot.min{background:var(--flag-min-bg)}
.dot.max{background:var(--flag-max-bg)}
.dot.dead{background:var(--flag-dead-bg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-3px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line)}
.chip.ok{background:#E7F4EF;color:var(--ok);border-color:#BFE3D6}
.chip.warn{background:#FCF3E2;color:var(--warn);border-color:#EEDBB4}
.chip.dead{background:#F3EADF;color:var(--flag-dead-ink);border-color:#DCC7AB}
.chip.max{background:#FBE9E7;color:var(--flag-max-ink);border-color:#F0CBC7}

.stat{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.stat div{flex:1;padding:12px 16px;border-right:1px solid var(--line-2)}
.stat div:last-child{border-right:0}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1.2}
.stat span{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,32,43,.42);display:none;z-index:60;padding:24px;overflow:auto}
.scrim.on{display:block}
.modal{max-width:860px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center}
.modal header h3{margin:0;font-size:15px}
.modal .body{padding:18px;max-height:70vh;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:90;
  transition:.22s ease;pointer-events:none;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.pill-tabs{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:#fff;padding:3px;gap:2px}
.pill-tabs button{border:0;background:none;padding:5px 14px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.pill-tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}

.search{position:relative}
.search .in{padding-left:30px}
.search::before{content:"⌕";position:absolute;left:10px;top:6px;color:var(--ink-3);font-size:16px}

/* ---------- เอกสารสำหรับพิมพ์ ---------- */
.paper{
  background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:14mm 14mm 12mm;
  border:1px solid var(--line);box-shadow:var(--shadow);color:#000;font-size:12.5px;line-height:1.45
}
.paper h1{font-size:19px;margin:0;letter-spacing:.02em}
.doc-head{display:flex;gap:16px;border-bottom:2px solid #000;padding-bottom:10px;align-items:flex-start}
.doc-head .co{flex:1}
.doc-head .co b{font-size:16px}
.doc-head .co div{font-size:11.5px;line-height:1.4}
.doc-meta{text-align:right;font-size:12px;min-width:190px}
.doc-meta table{width:100%;font-size:12px}
.doc-meta td{padding:1px 0}
.box{border:1px solid #000;padding:6px 8px;margin-top:8px}
.box h4{margin:0 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #999;padding-bottom:3px}
.kv{display:flex;gap:6px;font-size:12px;padding:1px 0}
.kv b{font-weight:600;color:#333;white-space:nowrap}
.kv span{border-bottom:1px dotted #999;flex:1;min-width:0}
table.doc{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.doc th{border:1px solid #000;padding:4px 6px;background:#EDEFF1;font-size:11px}
table.doc td{border:1px solid #000;padding:3px 6px}
.sign{display:flex;gap:26px;margin-top:16px}
.sign div{flex:1;text-align:center;font-size:12px}
.sign .line{border-bottom:1px dotted #000;height:34px;margin-bottom:5px}
.note-list{font-size:11px;margin:10px 0 0;padding-left:16px;line-height:1.55}
.tick{display:inline-block;width:11px;height:11px;border:1px solid #000;margin-right:5px;vertical-align:-1px;text-align:center;line-height:10px;font-size:10px}
.brandfoot{margin-top:12px;padding-top:5px;border-top:1px solid #CCC;font-size:9.5px;color:#666;display:flex;justify-content:space-between}
#printroot{display:none}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .app,.scrim,.toast{display:none !important}
  #printroot{display:block}
  .paper{width:auto;min-height:auto;border:0;box-shadow:none;margin:0;padding:12mm 12mm}
  .paper + .paper{page-break-before:always}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .rail .brand{border:0;padding:0 12px 0 0;margin:0}
  .rail .foot{display:none}
  .g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr}
  .paper{width:auto}
}

/* ⚠️ หมายเหตุความปลอดภัยสำหรับผู้พัฒนาที่มาต่อ (อ่านก่อนแตะโค้ดส่วนนี้):
   KEY_SALT, makeKey(), checkKey() ด้านล่างนี้คือระบบตรวจรหัสลิขสิทธิ์ที่ทำงาน
   "ฝั่ง client ล้วน ๆ" อยู่ในไฟล์ HTML นี้เอง ไม่มี server ตรวจสอบใด ๆ ทั้งสิ้น
   - ป้องกันผู้ใช้ทั่วไปที่ไม่ได้ตั้งใจหาทางเลี่ยงได้ในระดับหนึ่งเท่านั้น
   - ป้องกันคนที่รู้ JavaScript ไม่ได้ 100%: เปิด DevTools อ่านค่า KEY_SALT และ
     อัลกอริทึม enc32/fnv/checkKey แล้วคำนวณรหัสปลอมได้ หรือจะแก้ DB.lic.expires /
     เรียก licStatus() ตรง ๆ เพื่อบายพาสก็ทำได้เช่นกัน เพราะทุกอย่างอยู่ใน global
     scope ของหน้านี้ ตรวจสอบและแก้ไขได้จาก console โดยตรง
   ทั้งหมดนี้เป็น tradeoff ที่ยอมรับได้ตามแผนธุรกิจปัจจุบัน (แจกจ่ายเป็นไฟล์ HTML
   เดี่ยว ไม่มี backend) ไม่ต้องเปลี่ยนสถาปัตยกรรมตอนนี้ — แต่ถ้าอนาคตต้องการกัน
   การปลอมรหัสที่รัดกุมขึ้นจริง ๆ ต้องย้าย logic ตรวจรหัสไปไว้ฝั่ง server แทน */
const KEY_SALT   = 'DGL!drivebizbegin';
const KEY_EPOCH  = '2020-01-01';
const A32 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   // ตัดอักขระที่สับสน 0 1 I O ออก

function enc32(n, len){ let s=''; n=Math.abs(Math.floor(n)); for(let i=0;i<len;i++){ s=A32[n%32]+s; n=Math.floor(n/32); } return s; }
function dec32(s){ let n=0; for(const c of s){ const i=A32.indexOf(c); if(i<0) return -1; n=n*32+i; } return n; }
function fnv(str){ let h=0x811c9dc5>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
const digitsOf = v => String(v||'').replace(/\D/g,'');

function makeKey(taxId, expIso){
  const p1 = enc32(daysBetween(KEY_EPOCH, expIso), 3);
  const p2 = enc32(fnv(digitsOf(taxId) + p1 + KEY_SALT), 5);
  const raw = p1 + p2;
  return 'DGL-' + raw.slice(0,4) + '-' + raw.slice(4,8);
}
function checkKey(key, taxId){
  let raw = String(key||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(raw.startsWith('DGL')) raw = raw.slice(3);
  if(raw.length !== 8) return null;
  const p1 = raw.slice(0,3), p2 = raw.slice(3,8);
  const d = dec32(p1); if(d < 0) return null;
  if(enc32(fnv(digitsOf(taxId) + p1 + KEY_SALT), 5) !== p2) return null;
  return addDays(KEY_EPOCH, d);
}

function licInit(){
  DB.lic = DB.lic || {};
  if(!DB.lic.installedAt) DB.lic.installedAt = today();
  if(!('key' in DB.lic)) DB.lic.key = '';
  if(!('expires' in DB.lic)) DB.lic.expires = '';
}
function licStatus(){
  const L = DB.lic || {};
  if(L.expires){
    const left = daysBetween(today(), L.expires);
    return left >= 0 ? {mode:'active', left, until:L.expires} : {mode:'expired', left:0, until:L.expires, wasLicensed:true};
  }
  const until = addDays(L.installedAt || today(), TRIAL_DAYS);
  const left = daysBetween(today(), until);
  return left >= 0 ? {mode:'trial', left, until} : {mode:'expired', left:0, until};
}

   3) localStorage — ในเบราว์เซอร์
   4) หน่วยความจำชั่วคราว (mem) — ใช้เป็นทางเลือกสุดท้ายเท่านั้น ข้อมูลหายทันทีที่

   แต่ละชั้นห่อด้วย try/catch แยกกัน ชั้นหนึ่งพังไม่กระทบชั้นอื่น
   ถ้าเขียนข้อมูลไม่ลงชั้นถาวรใดเลย (เหลือแค่ mem) จะแจ้งเตือนผู้ใช้ทันทีเสมอ
   ห้ามปล่อยให้ข้อมูลหายไปแบบเงียบ ๆ
   ===================================================================== */

/* ---------- ตัวช่วย IndexedDB แบบย่อ สไตล์ idb-keyval — เขียนเองฝังในไฟล์ ไม่พึ่งเน็ต ---------- */
const idbkv = (() => {
  const DB_NAME = 'dgl_kv_store', STORE_NAME = 'kv';
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if(!window.indexedDB){ reject(new Error('indexedDB ไม่พร้อมใช้งาน')); return; }
      let req;
      try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ reject(e); return; }
      req.onupgradeneeded = () => { try{ req.result.createObjectStore(STORE_NAME); }catch(e){} };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('เปิด indexedDB ไม่สำเร็จ'));
      req.onblocked = () => reject(new Error('indexedDB ถูกบล็อก'));
    });
    return dbPromise;
  }
  function run(mode, fn){
    return openDB().then(db => new Promise((resolve, reject) => {
      let tx;
      try{ tx = db.transaction(STORE_NAME, mode); }catch(e){ reject(e); return; }
      const req = fn(tx.objectStore(STORE_NAME));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('ทำรายการ indexedDB ไม่สำเร็จ'));
    }));
  }
  return {
    get: (k) => run('readonly', s => s.get(k)),
    set: (k, v) => run('readwrite', s => s.put(v, k))
  };
})();

async function detectStorage(){
  try{
    if(window.storage && typeof window.storage.set === 'function' && typeof window.storage.get === 'function'){
      await window.storage.set('__dgl_probe__', '1');
      const r = await window.storage.get('__dgl_probe__');
      if(r && r.value === '1') return 'host';
    }
  }catch(e){}
  try{
    await idbkv.set('__dgl_probe__', 1);
    const v = await idbkv.get('__dgl_probe__');
    if(v === 1) return 'indexeddb';
  }catch(e){}
  try{ localStorage.setItem('__dgl_probe__','1'); localStorage.removeItem('__dgl_probe__'); return 'browser'; }catch(e){}
  return 'memory';
}

function warnStorageFailure(){
  lastPersistOk = false;
  toast('บันทึกข้อมูลถาวรไม่สำเร็จ! ข้อมูลอยู่ในหน่วยความจำชั่วคราวเท่านั้น — สำรองข้อมูลเป็นไฟล์ JSON ทันที');
  try{
    alert('⚠ บันทึกข้อมูลถาวรไม่สำเร็จ (พื้นที่จัดเก็บอาจเต็มหรือถูกปิดกั้น)\n\n' +
      'การเปลี่ยนแปลงล่าสุดอยู่ในหน่วยความจำชั่วคราวเท่านั้น และจะหายไปทันทีที่ปิดหรือรีโหลดหน้านี้\n\n' +
      'กรุณากด "สำรองข้อมูลทั้งหมด (JSON)" ที่เมนูตั้งค่าร้านทันที เพื่อไม่ให้ข้อมูลสูญหาย');
  }catch(e){}
}

const store = {
  async get(k){
    try{ const r = await window.storage.get(k); if(r && r.value) return JSON.parse(r.value); }catch(e){}
    try{ const v = await idbkv.get(k); if(v) return JSON.parse(v); }catch(e){}
    try{ const v = localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){}
    return (k in mem) ? mem[k] : null;
  },
  async set(k, v){
    mem[k] = v;
    const str = JSON.stringify(v);
    pendingWrites++;
    try{
      let ok = false;
      try{ await window.storage.set(k, str); ok = true; }catch(e){}
      if(!ok){ try{ await idbkv.set(k, str); ok = true; }catch(e){} }
      if(!ok){ try{ localStorage.setItem(k, str); ok = true; }catch(e){} }
      if(ok) lastPersistOk = true; else warnStorageFailure();
      return ok;
    } finally {
      pendingWrites--;
    }
  }
};

window.addEventListener('beforeunload', (e) => {
  if(pendingWrites > 0 || !lastPersistOk){
    e.preventDefault();
    e.returnValue = 'มีข้อมูลที่ยังบันทึกไม่เสร็จหรือบันทึกไม่สำเร็จ ต้องการปิดหน้านี้จริงหรือไม่?';
    return e.returnValue;
  }
});

/* ---------- schema version ของโครงสร้างข้อมูล DB — เพิ่มเลขใหม่ทุกครั้งที่แก้โครงสร้าง ---------- */
const SCHEMA_VERSION = 1;
/* คีย์คือ "เวอร์ชันปลายทาง" ของ migration แต่ละขั้น ฟังก์ชันรับ DB เก่าคืนค่า DB ที่แก้แล้ว
   เพิ่ม migration ใหม่ต่อท้ายเมื่ออัปเดตแอปในอนาคตแบบเปลี่ยนโครงสร้างข้อมูล ห้ามแก้ไขของเดิมที่ปล่อยไปแล้ว */
const DB_MIGRATIONS = {
  1: (d) => d   // ข้อมูลเก่าที่ยังไม่มี schemaVersion (v0) → v1: เริ่มนับเวอร์ชัน ไม่มีการเปลี่ยนโครงสร้าง
};
function migrateDB(d){
  let v = Number(d.schemaVersion) || 0;
  while(v < SCHEMA_VERSION){
    v++;
    const step = DB_MIGRATIONS[v];
    if(typeof step === 'function'){ d = step(d) || d; }
    d.schemaVersion = v;
  }
  return d;
}

/* ---------- ตรวจโครงสร้างไฟล์สำรองข้อมูลก่อนกู้คืนจริง — กันพังตอน render ทีหลัง ---------- */
function validateBackupShape(d){
  const errors = [];
  if(!d || typeof d !== 'object' || Array.isArray(d)){ errors.push('ไฟล์นี้ไม่ใช่ออบเจกต์ข้อมูลสำรองที่ถูกต้อง'); return errors; }

  if(d.shop !== undefined && d.shop !== null && typeof d.shop !== 'object')
    errors.push('shop ต้องเป็นออบเจกต์ข้อมูลร้าน');

  if(!Array.isArray(d.products)) errors.push('products ต้องเป็น array (พบ '+typeof d.products+')');
  else d.products.forEach((p,i)=>{
    if(!p || typeof p !== 'object'){ errors.push(`products[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!p.id) errors.push(`products[${i}] ไม่มี field "id"`);
    if(typeof p.code !== 'string') errors.push(`products[${i}] ไม่มี field "code" (รหัสสินค้า)`);
    if(typeof p.name !== 'string') errors.push(`products[${i}] ไม่มี field "name" (ชื่อสินค้า)`);
  });

  if(!Array.isArray(d.customers)) errors.push('customers ต้องเป็น array (พบ '+typeof d.customers+')');
  else d.customers.forEach((c,i)=>{
    if(!c || typeof c !== 'object'){ errors.push(`customers[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!c.id) errors.push(`customers[${i}] ไม่มี field "id"`);
    if(!Array.isArray(c.vehicles)) errors.push(`customers[${i}] ไม่มี field "vehicles" (ต้องเป็น array)`);
    if(!c.addr || typeof c.addr !== 'object') errors.push(`customers[${i}] ไม่มี field "addr"`);
  });

  if(!Array.isArray(d.quotes)) errors.push('quotes ต้องเป็น array (พบ '+typeof d.quotes+')');
  else d.quotes.forEach((q,i)=>{
    if(!q || typeof q !== 'object'){ errors.push(`quotes[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!q.id) errors.push(`quotes[${i}] ไม่มี field "id"`);
    if(!Array.isArray(q.items)) errors.push(`quotes[${i}] ไม่มี field "items" (ต้องเป็น array)`);
    if(!q.addr || typeof q.addr !== 'object') errors.push(`quotes[${i}] ไม่มี field "addr"`);
    if(!q.veh || typeof q.veh !== 'object') errors.push(`quotes[${i}] ไม่มี field "veh"`);
  });

  if(!Array.isArray(d.receipts)) errors.push('receipts ต้องเป็น array (พบ '+typeof d.receipts+')');
  else d.receipts.forEach((r,i)=>{
    if(!r || typeof r !== 'object'){ errors.push(`receipts[${i}] ไม่ใช่ออบเจกต์`); return; }
    if(!r.id) errors.push(`receipts[${i}] ไม่มี field "id"`);
    if(!Array.isArray(r.items)) errors.push(`receipts[${i}] ไม่มี field "items" (ต้องเป็น array)`);
    if(!r.addr || typeof r.addr !== 'object') errors.push(`receipts[${i}] ไม่มี field "addr"`);
    if(!r.veh || typeof r.veh !== 'object') errors.push(`receipts[${i}] ไม่มี field "veh"`);
    if(!r.pay || typeof r.pay !== 'object') errors.push(`receipts[${i}] ไม่มี field "pay"`);
  });

  if(d.seq !== undefined && d.seq !== null && typeof d.seq !== 'object')
    errors.push('seq ต้องเป็นออบเจกต์ (พบ '+typeof d.seq+')');

  return errors;
}

  if(!DB.shop) DB.shop = Object.assign({}, DEFAULT_SHOP);
  if(!DB.products.length) DB.products = seedProducts();
  if(!DB.customers) DB.customers = [];
  if(!DB.customers.length) DB.customers = seedCustomers();
  if(!DB.seq) DB.seq = {q:0,r:0,c:0};
  if(!('lastExportAt' in DB)) DB.lastExportAt = null;
  licInit();
  await saveDB();
}

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=> Math.random().toString(36).slice(2,10);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n=parseFloat(String(v??'').replace(/,/g,'')); return isFinite(n)?n:0; };
const money = n => (Math.round(num(n)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso = d => d.toISOString().slice(0,10);
const today = ()=> iso(new Date());
function thDate(s){
  if(!s) return '-';
  const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  const m=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()+543}`;
}
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+num(n)); return iso(d); }
function monthsSince(s){
  if(!s) return 999;
  const d=new Date(s+'T00:00:00'), n=new Date();
  return (n.getFullYear()-d.getFullYear())*12 + (n.getMonth()-d.getMonth()) - (n.getDate()<d.getDate()?1:0);
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
function opts(list, sel, ph){
  return (ph!==undefined?`<option value="">${esc(ph)}</option>`:'') +
    list.map(v=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(v)}</option>`).join('');
}
function bahttext(n){
  n = Math.round(num(n)*100)/100;
  if(n===0) return "ศูนย์บาทถ้วน";
  const T=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"], P=["","สิบ","ร้อย","พัน","หมื่น","แสน","ล้าน"];
  function chunk(s){
    let out=""; const L=s.length;
    for(let i=0;i<L;i++){
      const d=+s[i], pos=L-i-1;
      if(d===0) continue;
      if(pos===0 && d===1 && L>1) out+="เอ็ด";
      else if(pos===1 && d===1) out+="สิบ";
      else if(pos===1 && d===2) out+="ยี่สิบ";
      else out+=T[d]+P[pos];
    }
    return out;
  }
  function whole(s){
    s=String(s);
    if(s.length>6){ return whole(s.slice(0,s.length-6))+"ล้าน"+(+s.slice(-6)? chunk(s.slice(-6)) : ""); }
    return chunk(s);
  }
  const b=Math.floor(n), st=Math.round((n-b)*100);
  return (b?whole(b):"ศูนย์")+"บาท"+(st? chunk(String(st))+"สตางค์" : "ถ้วน");
}

/* =====================================================================
   สถานะสต๊อก — กติกาสี
   ===================================================================== */
function flagsOf(p){
  const f=[];
  if(num(p.qty) <= num(p.min)) f.push('min');
  if(num(p.qty) >  num(p.max)) f.push('max');
  if(monthsSince(p.lastMove) >= 6) f.push('dead');
  return f;
}
const FLAG_LABEL = {min:'ถึงจุดสั่งซื้อ (Min)', max:'เกินระดับสูงสุด (Max)', dead:'ไม่เคลื่อนไหว ≥ 6 เดือน'};
function tagHTML(p){
  const f = flagsOf(p);
  const cls = f.includes('min')?'min': f.includes('max')?'max': f.includes('dead')?'dead':'';
  const dots = f.length>1 ? `<span class="dots">${f.map(x=>`<span class="dot ${x}" title="${FLAG_LABEL[x]}"></span>`).join('')}</span>` : '';
  const title = f.length? f.map(x=>FLAG_LABEL[x]).join(' · ') : 'ปกติ';
  return `<span class="tag ${cls}" title="${title}">${esc(p.code)}</span>${dots}`;
}

const PREFIXES = ["นาย","นาง","นางสาว","ด.ช.","ด.ญ.","ว่าที่ ร.ต.","ร.ต.","ร.ท.","ร.อ.","พ.ต.","พ.ท.","พ.อ.","ดร.","อื่น ๆ"];

function nextCustCode(){
  DB.seq = DB.seq || {q:0,r:0,c:0};
  DB.seq.c = (DB.seq.c||0)+1;
  return 'CUS-'+String(DB.seq.c).padStart(4,'0');
}
function custName(c){
  if(!c) return '';
  return c.type==='company' ? (c.orgName||'') : [c.prefix,c.firstName,c.lastName].filter(Boolean).join(' ');
}
function blankVehicle(){ return {id:uid(), brand:'', model:'', year:'', color:'', plateA:'', plateB:'', plateProv:'', mileage:'', lastService:''}; }
function blankCustomer(){
  return {id:uid(), code:'', type:'person', prefix:'นาย', firstName:'', lastName:'', orgName:'', taxId:'',
    addr:{no:'',village:'',moo:'',soi:'',road:'',subdistrict:'',district:'',province:'',zip:''},
    tel:'', tel2:'', email:'', note:'', created:today(), vehicles:[blankVehicle()]};
}
function plateOf(v){ return [v.plateA,v.plateB].filter(Boolean).join(' ') || '-'; }
function custHistory(c){
  const qs = DB.quotes.filter(q=>q.custId===c.id);
  const rs = DB.receipts.filter(r=>DB.quotes.some(q=>q.id===r.quoteId && q.custId===c.id));
  const spent = rs.reduce((s,r)=>s+recTotals(r).payable,0);
  const last = qs.map(q=>q.date).sort().slice(-1)[0] || '';
  return {quotes:qs, receipts:rs, spent, last};
}

function customerModalRebind(c, body, renderVeh, readAll){

/* นำข้อมูลลูกค้าจากทะเบียนมาใส่ในใบเสนอราคา */
function applyCustomer(c, v){
  const q = curQuote;
  q.custId = c.id; q.custType = c.type; q.taxId = c.taxId; q.name = custName(c);
  q.addr = JSON.parse(JSON.stringify(c.addr));
  q.tel = c.tel; q.tel2 = c.tel2; q.email = c.email;
  if(v){
    q.vehId = v.id;
    q.veh = {brand:v.brand, model:v.model, year:v.year, color:v.color,
             plateA:v.plateA, plateB:v.plateB, plateProv:v.plateProv, mileage:v.mileage};
  }
}

  };
  const bind = ()=>{
    $('#pcQ').oninput = e=>{ const v=e.target.value; $('#mBody').innerHTML = render(v);
      const el=$('#pcQ'); el.focus(); el.setSelectionRange(v.length,v.length); bind(); };

      const c = DB.customers.find(x=>x.id===b.dataset.pc);

      applyCustomer(c, v); closeModal(); renderQuote(); toast('ดึงข้อมูล '+custName(c)+' แล้ว');

  openModal('ดึงข้อมูลจากทะเบียนลูกค้า', render(''), [{label:'ปิด', cls:'btn', act:closeModal}]);
  bind();
}

/* บันทึกลูกค้าที่กรอกในใบเสนอราคาเข้าทะเบียน */
function saveQuoteCustomer(){
  if(!requireLicense()) return;
  collectQuote();
  const q = curQuote;
  if(!q.name) return toast('กรอกชื่อลูกค้าก่อน');
  let c = q.custId ? DB.customers.find(x=>x.id===q.custId) : null;
  const isNew = !c;
  if(isNew){ c = blankCustomer(); c.code = nextCustCode(); c.vehicles = []; }
  c.type = q.custType; c.taxId = q.taxId; c.tel = q.tel; c.tel2 = q.tel2; c.email = q.email;
  c.addr = JSON.parse(JSON.stringify(q.addr));
  if(q.custType==='company'){ c.orgName = q.name; }
  else {
    const p = q.name.trim().split(/\s+/);
    const pre = PREFIXES.includes(p[0]) ? p.shift() : (c.prefix||'');
    c.prefix = pre; c.firstName = p.shift()||''; c.lastName = p.join(' ');
  }
  const V = q.veh;
  if(V.brand || V.model || V.plateB){
    let v = q.vehId ? (c.vehicles||[]).find(x=>x.id===q.vehId) : null;
    if(!v){ v = blankVehicle(); c.vehicles = c.vehicles||[]; c.vehicles.push(v); q.vehId = v.id; }
    Object.assign(v, {brand:V.brand, model:V.model, year:V.year, color:V.color,
      plateA:V.plateA, plateB:V.plateB, plateProv:V.plateProv, mileage:V.mileage, lastService:q.date});
  }
  if(isNew) DB.customers.push(c);
  q.custId = c.id;
  saveDB(); renderQuote();
  toast(isNew? 'เพิ่มลูกค้า '+c.code+' เข้าทะเบียนแล้ว' : 'ปรับปรุงข้อมูลลูกค้า '+c.code+' แล้ว');
}

function collectQuote(){
  const q=curQuote; if(!$('#q_name')) return;
  q.custType=$('#q_custType').value; q.taxId=$('#q_taxId').value.trim(); q.name=$('#q_name').value.trim();
  ['no','village','moo','soi','road','subdistrict','district','province','zip'].forEach(k=>q.addr[k]=$('#a_'+k).value.trim());
  q.tel=$('#q_tel').value.trim(); q.tel2=$('#q_tel2').value.trim(); q.email=$('#q_email').value.trim();
  ['brand','model','year','color','plateA','plateB','plateProv','mileage'].forEach(k=>q.veh[k]=$('#v_'+k).value.trim());
  q.complaints=q.complaints.map((_,i)=>$('#c_'+i).value.trim());
  q.findings=q.findings.map((_,i)=>$('#d_'+i).value.trim());
  q.proposer=$('#q_proposer').value.trim(); q.approver=$('#q_approver').value.trim(); q.date=$('#q_date').value||today();
  const d=$('#q_discount'), v=$('#q_vatMode');
  if(d) q.discount=num(d.value); if(v) q.vatMode=v.value;
}
function repriceItems(){
  const key = {A:'pA',B:'pB',C:'pC'}[curQuote.tier];
  curQuote.items.forEach(it=>{ if(it.pid){ const p=DB.products.find(x=>x.id===it.pid); if(p) it.price=num(p[key]); } });
}
function totalsOf(q){
  const sub = q.items.reduce((s,it)=>s+num(it.qty)*num(it.price),0);
  const disc = num(q.discount);
  const base = Math.max(0, sub - disc);
  const rate = num(DB.shop.vatRate)/100;
  let net=base, vat=0, grand=base;
  if(q.vatMode==='ex'){ vat = base*rate; grand = base+vat; }
  else if(q.vatMode==='in'){ net = base/(1+rate); vat = base-net; grand = base; }
  return {sub, disc, base, net:Math.round(net*100)/100, vat:Math.round(vat*100)/100, grand:Math.round(grand*100)/100};
}

    const key = {A:'pA',B:'pB',C:'pC'}[curQuote.tier];
    const list = DB.products.filter(p=>{ const q=kw.toLowerCase();
      return !q || [p.code,p.oem,p.name].some(v=>String(v).toLowerCase().includes(q)); });
    return `
      <div class="search" style="margin-bottom:12px"><input class="in" id="pkQ" placeholder="ค้นหา รหัส / OEM / ชื่ออะไหล่" value="${esc(kw)}"></div>
      <div class="tablewrap" style="max-height:52vh;border:1px solid var(--line);border-radius:6px">
        <table class="tbl"><thead><tr><th>รหัสสินค้า</th><th>OEM</th><th>ชื่อสินค้า</th><th class="num">คงเหลือ</th><th class="num">ราคา ${curQuote.tier}</th><th></th></tr></thead><tbody>
        ${list.length? list.map(p=>`<tr>
          <td>${tagHTML(p)}</td><td class="mono" style="font-size:12px;color:var(--ink-3)">${esc(p.oem||'-')}</td>
          <td>${esc(p.name)}</td><td class="num mono">${num(p.qty)}</td><td class="num mono">${money(p[key])}</td>
          <td style="text-align:right"><button class="btn sm primary" data-add="${p.id}">เพิ่ม</button></td></tr>`).join('')
          : `<tr><td colspan="6" class="empty">ไม่พบอะไหล่ที่ค้นหา</td></tr>`}
        </tbody></table></div>`;
  };
  const bind = ()=>{
    $('#pkQ').oninput = e=>{ const v=e.target.value; $('#mBody').innerHTML = render(v); const el=$('#pkQ'); el.focus(); el.setSelectionRange(v.length,v.length); bind(); };
    $$('[data-add]').forEach(b=>b.onclick=()=>{
      const p = DB.products.find(x=>x.id===b.dataset.add);
      const key = {A:'pA',B:'pB',C:'pC'}[curQuote.tier];
      const ex = curQuote.items.find(i=>i.pid===p.id);
      if(ex) ex.qty = num(ex.qty)+1;
      else curQuote.items.push({pid:p.id, code:p.code, oem:p.oem, name:p.name, unit:p.unit, qty:1, price:num(p[key])});
      renderQuoteItems(); toast(`เพิ่ม ${p.code} แล้ว`);
    });
  };
  openModal('ดึงอะไหล่จากสต๊อก', render(''), [{label:'ปิด', cls:'btn primary', act:closeModal}]);
  bind();
}

function saveQuote(){
  if(!requireLicense()) return;
  collectQuote();
  if(!curQuote.name) return toast('กรอกชื่อลูกค้าก่อนบันทึก');
  if(curQuote.custId && curQuote.vehId){
    const c = DB.customers.find(x=>x.id===curQuote.custId);
    const v = c && (c.vehicles||[]).find(x=>x.id===curQuote.vehId);
    if(v && curQuote.veh.mileage){ v.mileage = curQuote.veh.mileage; v.lastService = curQuote.date; }
  }
  const i = DB.quotes.findIndex(x=>x.id===curQuote.id);
  const copy = JSON.parse(JSON.stringify(curQuote));
  if(i>=0) DB.quotes[i]=copy; else DB.quotes.push(copy);
  saveDB(); renderQuote(); toast('บันทึกเอกสาร '+copy.no+' แล้ว');
}

let curRec = null;

function recFromQuote(q){
  return {
    id:uid(), no:nextNo('r'), date:today(), quoteId:q.id, quoteNo:q.no,
    custId:q.custId||null, custType:q.custType, taxId:q.taxId, name:q.name,
    addr:JSON.parse(JSON.stringify(q.addr)),
    tel:q.tel, email:q.email||'', veh:JSON.parse(JSON.stringify(q.veh)),
    items:JSON.parse(JSON.stringify(q.items)), discount:num(q.discount), vatMode:q.vatMode,
    whtRate:0, pay:{cash:true, transfer:false, credit:false, days:30, due:'', ref:''},
    receivedBy:DB.shop.name?'':'', deducted:false
  };
}
function recTotals(r){
  const t = totalsOf(r);
  const wht = Math.round(t.net * num(r.whtRate)) / 100;
  return Object.assign(t, {wht, payable: Math.round((t.grand - wht)*100)/100});
}
function dueDate(r){ return r.pay.credit ? addDays(r.date, r.pay.days) : ''; }

function payLabel(r){
  const a=[]; if(r.pay.cash)a.push('เงินสด'); if(r.pay.transfer)a.push('เงินโอน');

}

    a.download=`drivegolight-backup-${today()}.json`; a.click();
    DB.lastExportAt = new Date().toISOString();
    await saveDB();
    renderBackupBanner();
    toast('สำรองข้อมูลเรียบร้อย เก็บไฟล์ไว้ในที่ปลอดภัย');

          const shown = errors.slice(0,8).map(x=>'· '+x).join('\n');
          const more = errors.length>8 ? `\n…และอีก ${errors.length-8} ข้อผิดพลาด` : '';

          return;

        if(!confirm(`กู้คืนข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่\n\nอะไหล่ ${d.products.length} รายการ · ลูกค้า ${(d.customers||[]).length} ราย · ใบเสนอราคา ${(d.quotes||[]).length} ฉบับ · ใบเสร็จ ${(d.receipts||[]).length} ฉบับ`)) return;
        DB = Object.assign({schemaVersion:SCHEMA_VERSION, shop:null,products:[],customers:[],quotes:[],receipts:[],seq:{q:0,r:0,c:0},lastExportAt:null}, migrateDB(d));
        if(!DB.shop) DB.shop = Object.assign({}, DEFAULT_SHOP);
        await saveDB();
        $('#brandName').textContent = DB.shop.name;
        curQuote = null; curRec = null;
        go('settings');
        toast(DB.products.length > MAX_PRODUCTS
          ? `กู้คืนแล้ว แต่มีอะไหล่ ${DB.products.length.toLocaleString()} รายการ เกินขีดจำกัด ${MAX_PRODUCTS.toLocaleString()} — เพิ่มรายการใหม่ไม่ได้จนกว่าจะลบให้ต่ำกว่าขีดจำกัด`
          : 'กู้คืนข้อมูลเรียบร้อยแล้ว');
      }catch(err){ toast('ไฟล์ไม่ถูกต้อง: '+err.message); }
      finally{ e.target.value=''; }
    };
    rd.readAsText(file);
  };
}

function paintLicBadge(){
  const st = licStatus(), el = $('#licBadge');
  if(!el) return;
  const cls = st.mode==='active' ? (st.left<=30?'warn':'active') : st.mode==='trial' ? (st.left<=3?'warn':'trial') : 'expired';
  const txt = st.mode==='trial'   ? `<b>ทดลองใช้ เหลือ ${st.left} วัน</b>ครบกำหนด ${thDate(st.until)} · กดเพื่อต่ออายุ`
            : st.mode==='active'  ? `<b>ลิขสิทธิ์ใช้งานได้</b>ถึง ${thDate(st.until)} (อีก ${st.left} วัน)`
            : `<b>หมดอายุการใช้งาน</b>บันทึกรายการใหม่ไม่ได้ · กดเพื่อต่ออายุ`;
  el.className = 'licbadge ' + cls;
  el.innerHTML = txt;
}

function addrLine(a){
  const p=[];
  if(a.no) p.push(`${a.no}`);
  if(a.village) p.push(`${a.village}`);
  if(a.moo) p.push(`หมู่ ${a.moo}`);
  if(a.soi) p.push(`ซ.${a.soi}`);
  if(a.road) p.push(`ถ.${a.road}`);
  if(a.subdistrict) p.push(`แขวง/ต.${a.subdistrict}`);
  if(a.district) p.push(`เขต/อ.${a.district}`);
  if(a.province) p.push(a.province);
  if(a.zip) p.push(a.zip);
  return p.join(' ') || '-';
}

          <div>${tick(r.pay.transfer)} ชำระโดยเงินโอน ${r.pay.ref?`<span style="border-bottom:1px dotted #999">&nbsp;${esc(r.pay.ref)}&nbsp;</span>`:'.......................................'}</div>
          <div>${tick(r.pay.credit)} เครดิต <span style="border-bottom:1px dotted #999">&nbsp;${r.pay.credit?num(r.pay.days):'........'}&nbsp;</span> วัน
            &nbsp; ครบกำหนดชำระ <b>${r.pay.credit? thDate(due) : '................'}</b></div>
        </div>
        <div style="margin-top:8px;font-size:11.5px;border-top:1px dotted #999;padding-top:5px">
          จำนวนเงิน (ตัวอักษร) <b>${bahttext(t.payable)}</b></div>
      </div>
      <table class="doc" style="width:46%;margin-top:0">
        <tr><td>รวมเป็นเงิน</td><td style="text-align:right;width:96px">${money(t.sub)}</td></tr>
        <tr><td>ส่วนลด</td><td style="text-align:right">${money(t.disc)}</td></tr>
        <tr><td>มูลค่าก่อนภาษี</td><td style="text-align:right">${money(t.net)}</td></tr>
        <tr><td>ภาษีมูลค่าเพิ่ม ${r.vatMode==='none'?'(ไม่คิด)':DB.shop.vatRate+'%'}</td><td style="text-align:right">${money(t.vat)}</td></tr>
        <tr><td><b>รวมทั้งสิ้น</b></td><td style="text-align:right"><b>${money(t.grand)}</b></td></tr>
        <tr><td>หัก ณ ที่จ่าย ${num(r.whtRate)}%</td><td style="text-align:right">−${money(t.wht)}</td></tr>
        <tr><td style="background:#EDEFF1"><b>ยอดสุทธิที่รับชำระ</b></td><td style="text-align:right;background:#EDEFF1"><b>${money(t.payable)}</b></td></tr>
      </table>
    </div>

    <div class="sign">
      <div><div class="line"></div>ผู้รับเงิน<br><span style="font-size:11px">( ${esc(r.receivedBy||'.'.repeat(24))} )</span></div>
      <div><div class="line"></div>ผู้จ่ายเงิน / ผู้รับรถ<br><span style="font-size:11px">( ${esc(r.name||'.'.repeat(24))} )</span></div>
    </div>
    <div style="font-size:10.5px;margin-top:10px;color:#555">เอกสารนี้ออกจากใบเสนอราคา/ใบอนุมัติซ่อมเลขที่ ${esc(r.quoteNo||'-')} · ใบเสร็จรับเงินฉบับนี้จะสมบูรณ์เมื่อได้รับเงินตามยอดสุทธิเรียบร้อยแล้ว</div>
    <div class="brandfoot"><span>จัดทำด้วยโปรแกรม ${APP.name} รุ่น ${APP.version}</span><span>${APP.site}</span></div>
  </div>`);
}

/* แบนเนอร์เตือนถ้ายังไม่ได้สำรองข้อมูลเกิน 7 วัน — เช็กและอัปเดตทุกครั้งที่เปลี่ยนหน้า */
function renderBackupBanner(){
  const el = $('#backupBanner'); if(!el) return;
  const last = DB.lastExportAt;
  const days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : null;
  if(days === null || days > 7){
    el.innerHTML = `<span>⚠ ${last ? `ยังไม่ได้สำรองข้อมูลมา ${days} วันแล้ว` : 'ยังไม่เคยสำรองข้อมูลเลย'} — ควรสำรองข้อมูลเก็บไว้เป็นไฟล์ JSON กันข้อมูลหาย</span><button class="btn sm" id="backupBannerBtn">สำรองข้อมูลตอนนี้</button>`;
    el.classList.add('on');
    $('#backupBannerBtn').onclick = ()=> go('settings');
  } else {
    el.classList.remove('on');
    el.innerHTML = '';
  }
}

   ตัวควบคุมหน้าจอ
   ===================================================================== */
const VIEWS = {
  stock:   {title:'สต๊อกอะไหล่', sub:'รหัสสินค้าเปลี่ยนสีอัตโนมัติตามระดับ Min / Max และการเคลื่อนไหว', render:renderStock,
            actions:`<button class="btn primary" id="addProd">+ เพิ่มสินค้า</button>`},
  customer:{title:'ข้อมูลลูกค้า', sub:'ทะเบียนลูกค้า ที่อยู่ ข้อมูลติดต่อ และรถที่ดูแล พร้อมประวัติการเข้าซ่อม', render:renderCustomer,
            actions:`<button class="btn primary" id="addCust">+ เพิ่มลูกค้า</button>`},
  quote:   {title:'ใบเสนอราคา / ใบอนุมัติซ่อม', sub:'ดึงข้อมูลลูกค้าจากทะเบียน พร้อมอาการเสียและรายการอะไหล่จากสต๊อก', render:renderQuote, actions:''},
  receipt: {title:'ใบเสร็จรับเงิน', sub:'ดึงข้อมูลจากใบเสนอราคา พร้อมภาษีมูลค่าเพิ่มและหัก ณ ที่จ่าย', render:renderReceipt, actions:''},
  settings:{title:'ตั้งค่าร้าน', sub:'ข้อมูลที่ใช้พิมพ์บนหัวเอกสารทุกฉบับ', render:renderSettings, actions:''},
  license: {title:'ลิขสิทธิ์การใช้งาน', sub:`ทดลองใช้ฟรี ${TRIAL_DAYS} วัน จากนั้นค่าบริการปีละ ${PRICE_YEAR.toLocaleString()} บาท`, render:renderLicense, actions:''}
};
function go(v){
  $$('.view').forEach(s=>s.classList.remove('on'));
  $('#view-'+v).classList.add('on');
  $$('.navbtn').forEach(b=>b.setAttribute('aria-current', String(b.dataset.view===v)));
  $('#viewTitle').textContent = VIEWS[v].title;
  $('#viewSub').textContent = VIEWS[v].sub;
  $('#topActions').innerHTML = VIEWS[v].actions;
  VIEWS[v].render();
  if(v==='stock') $('#addProd').onclick = ()=>{
    if(DB.products.length >= MAX_PRODUCTS)
      return toast(`ทะเบียนอะไหล่เต็มแล้ว ${MAX_PRODUCTS.toLocaleString()} รายการ — ลบรายการที่เลิกใช้ก่อน`);
    productModal(null);
  };
  if(v==='customer') $('#addCust').onclick = ()=>customerModal(null);
  paintLicBadge();
  renderBackupBanner();
}
$$('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.view));

(async function init(){
  STORAGE_MODE = await detectStorage();
  await loadDB();
  $('#brandName').textContent = DB.shop.name;
  $('#railFoot').innerHTML =
    `<button class="licbadge" id="licBadge" onclick="go('license')"></button>` +
    (STORAGE_MODE==='memory'
      ? `<div class="memwarn">โปรแกรมนี้บันทึกข้อมูลถาวรไม่ได้ในหน้าต่างปัจจุบัน<br>กรุณาดาวน์โหลดไฟล์ไปเปิดบนเครื่อง หรือสำรองข้อมูลเป็นไฟล์ JSON ก่อนปิด</div>`
      : `${STORAGE_STATUS_TEXT[STORAGE_MODE]}<br>`) +
    `กด <b>พิมพ์</b> เพื่อออกเอกสาร A4<br>
     <span style="opacity:.75">${APP.name} รุ่น ${APP.version}</span><br>
     <a href="https://${APP.site}" target="_blank" rel="noopener">${APP.site}</a>`;
  go('stock');
  paintLicBadge();
  renderBackupBanner();
  const st = licStatus();
  if(st.mode==='expired') go('license');
  else if(st.mode==='trial' && st.left<=3) toast(`ทดลองใช้เหลืออีก ${st.left} วัน — ต่ออายุได้ที่เมนูลิขสิทธิ์การใช้งาน`);
})();
</script>
